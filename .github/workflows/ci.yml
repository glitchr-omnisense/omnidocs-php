# The package's CI: glitchr-studio/ci's reusable workflow, pinned to a commit (the PHP 8.4 image, the
# package installed alone, PHPUnit with omnidocs' conformance suite, PHPStan against phpstan-baseline.neon,
# a consumer install without require-dev).
name: ci

on:
  push:
    branches: ['1.x']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  package:
    uses: glitchr-studio/ci/.github/workflows/php-package.yml@138b69073f0983bce077fbb9e1f4e4ad88c77dc7
    with:
      smoke-class: 'Omnidocs\Php\PhpSourceFactory'
